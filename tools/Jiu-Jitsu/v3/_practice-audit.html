<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ポジション人形の検証</title>
    <style>
      body { margin: 0; background: #172331; color: #eee; font: 14px system-ui; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; align-items: center; }
      select, button { font: inherit; padding: 6px; }
      #view { height: calc(100vh - 115px); min-height: 300px; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #pins { display: none; }
      #caption { padding: 12px; margin: 0; }
    </style>
  </head>
  <body>
    <nav id="toolbar"></nav>
    <div id="view"><canvas id="canvas" aria-label="ポジション人形"></canvas><div id="pins" hidden></div></div>
    <p id="caption"></p>
    <script type="module" src="/src/practiceAudit.ts"></script>
  </body>
</html>
