[package]
name = "kata-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Skill evaluation CLI for the Claude Code CLI. waxa/waza-schema-compatible runner with empirical-prompt-tuning iterate loop, structured self-report grader, and LLM-as-Judge."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "fs", "sync"] }
futures = "0.3"
regex = "1"
rhai = { version = "1.19", default-features = false, features = ["std", "sync"] }
glob = "0.3"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[[bin]]
name = "kata"
path = "src/main.rs"

[lib]
name = "kata_eval"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1
