[package]
name = "rbp-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust Best Practices Linter built on rowan / ra_ap_syntax"
license = "MIT"

[dependencies]
ra_ap_syntax = "0.0.331"
rowan = "0.16"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"

[lib]
name = "rbp_lint"
path = "src/lib.rs"

[[bin]]
name = "rbp-lint"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
