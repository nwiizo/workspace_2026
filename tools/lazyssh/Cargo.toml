[package]
name = "lazyssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "A keyboard-first TUI for connecting to hosts in OpenSSH config"
license = "MIT"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
glob = "0.3"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }

[dev-dependencies]
tempfile = "3"
