<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Minagine 備考一括入力</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 320px;
        margin: 0;
        padding: 16px;
        font-size: 13px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #444;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-bottom: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      button {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      .primary {
        background: #1976d2;
        color: #fff;
      }
      .secondary {
        background: #eee;
        color: #333;
      }
      .options {
        margin-bottom: 12px;
      }
      .options label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #444;
        font-size: 12px;
      }
      #status {
        margin-top: 12px;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 4px;
        min-height: 1.4em;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .note {
        font-size: 11px;
        color: #888;
        margin-top: 8px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>備考一括入力</h1>
    <label for="memo-text">入力する備考</label>
    <input id="memo-text" type="text" value="自己啓発・研鑽" />

    <div class="options">
      <label>
        <input id="only-red" type="checkbox" checked />
        赤くなっている行のみ対象（備考必須行）
      </label>
      <label>
        <input id="skip-filled" type="checkbox" checked />
        既に入力済みの行はスキップ
      </label>
      <label>
        <input id="only-worked" type="checkbox" />
        勤務時間がある行のみ対象
      </label>
      <label>
        <input id="auto-commit" type="checkbox" checked />
        最後に「保存する」を自動クリック
      </label>
    </div>

    <div class="row">
      <button id="run" class="primary">一括入力を実行</button>
      <button id="dry-run" class="secondary">対象を確認</button>
    </div>

    <div id="status">待機中</div>
    <p class="note">
      ※
      該当ページを開いた状態で実行してください。各行のメモアイコンを順番に開いて保存します。
      途中で操作しないでください。
    </p>
    <script src="popup.js"></script>
  </body>
</html>
