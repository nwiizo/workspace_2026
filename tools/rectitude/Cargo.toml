[package]
name = "rectitude"
version = "0.1.0"
edition = "2024"
description = "General-purpose security testing library with scenario-based execution"
license = "MIT"
repository = "https://github.com/probitas-test/probitas"
keywords = ["security", "testing", "ctf", "pentesting", "web-security"]
categories = ["development-tools::testing", "web-programming"]

[lib]
name = "rectitude"
path = "src/lib.rs"

[[bin]]
name = "rectitude"
path = "src/bin/main.rs"

[dependencies]
# HTTP client (always included)
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"] }
tokio = { version = "1", features = ["full"] }

# GraphQL client (optional)
graphql_client = { version = "0.14", optional = true }

# SQL clients (optional)
sqlx = { version = "0.8", optional = true, default-features = false }

# MongoDB client (optional)
mongodb = { version = "3", optional = true }

# Redis client (optional)
redis = { version = "0.26", optional = true, features = ["tokio-comp"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
base64 = "0.22"
hex = "0.4"
z85 = "3.0"

# Archive handling (optional)
zip = { version = "2.1", optional = true }

# Crypto
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md5 = "0.7"

# CLI
clap = { version = "4", features = ["derive"] }

# Async
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
toml = "0.8"

# Date/time for reports
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL handling
url = "2"

# Regex for pattern matching
regex = "1"
urlencoding = "2.1.3"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[features]
default = ["cli"]
cli = []

# Additional client features (HTTP is always included)
graphql = ["dep:graphql_client"]
sql-postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/runtime-tokio"]
sql-mysql = ["dep:sqlx", "sqlx/mysql", "sqlx/runtime-tokio"]
sql-sqlite = ["dep:sqlx", "sqlx/sqlite", "sqlx/runtime-tokio"]
mongodb = ["dep:mongodb"]
redis = ["dep:redis"]

# Archive payloads (Zip Slip, etc.)
zip-payloads = ["dep:zip"]

# Full feature set (all optional clients)
full = ["graphql", "sql-postgres", "sql-mysql", "sql-sqlite", "mongodb", "redis", "zip-payloads"]
