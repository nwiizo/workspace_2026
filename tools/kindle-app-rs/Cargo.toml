[package]
name = "kindle-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Capture Kindle pages on macOS and turn screenshots into PDFs"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
chromiumoxide = "0.9.1"
chromiumoxide_cdp = "0.9.1"
futures = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
printpdf = { version = "0.12.7", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
lopdf = { version = "0.44.0", default-features = false }
tempfile = "3.27.0"
