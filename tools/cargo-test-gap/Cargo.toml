[package]
name = "cargo-test-gap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rank Rust functions by churn, complexity, exposure, and test coverage gap"
license = "MIT"
publish = false

[lib]
name = "cargo_test_gap"
path = "src/lib.rs"

[[bin]]
name = "cargo-test-gap"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.19"
clap = { version = "4.5", features = ["derive"] }
design-gate-core = { path = "../design-gate-core" }
ra_ap_syntax = "0.0.331"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
