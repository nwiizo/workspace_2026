[package]
name = "cargo-boundary"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cargo_metadata = "0.18"
clap = { version = "4", features = ["derive"] }
design-gate-core = { path = "../design-gate-core" }
ra_ap_syntax = "0.0.331"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
