[workspace]
resolver = "2"
members = [
    "crates/rustprobe",
    "crates/rustprobe-driver",
    "crates/rustprobe-runtime",
    "crates/rustprobe-analysis",
]
exclude = [
    "tests/integration/sample_crate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nwiizo/workspace_2026"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
