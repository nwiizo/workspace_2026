[package]
name = "rustlean"
version = "0.1.0"
edition = "2024"
description = "MIR-based optimization assistance tool for Rust"
license = "Apache-2.0"
authors = ["nwiizo"]
repository = "https://github.com/nwiizo/workspace_2026"
keywords = ["rust", "optimization", "mir", "performance", "analysis"]
categories = ["development-tools", "development-tools::profiling"]

[lib]
name = "rustlean"
path = "src/lib.rs"

[[bin]]
name = "rustlean-driver"
path = "src/bin/rustlean_driver.rs"

[[bin]]
name = "cargo-rustlean"
path = "src/bin/cargo_rustlean.rs"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
