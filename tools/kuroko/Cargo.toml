[package]
name = "kuroko"
version = "0.1.0"
edition = "2024"
description = "A lightweight AWS service emulator in Rust"
license = "MIT"
repository = "https://github.com/nwiizo/workspace_2026"

[[bin]]
name = "kuroko"
path = "src/main.rs"

[lib]
name = "kuroko"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "matched-path"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = "1"
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
quick-xml = { version = "0.36", features = ["serialize"] }
ciborium = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
mime = "0.3"
url = "2"
rand = "0.8"
urlencoding = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
aws-sdk-dynamodb = "1"
aws-sdk-sns = "1"
aws-sdk-kms = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-sts = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-ssm = "1"
aws-sdk-eventbridge = "1"
aws-sdk-lambda = "1"
aws-sdk-kinesis = "1"
aws-sdk-sfn = "1"
aws-sdk-iam = "1"
aws-sdk-ecr = "1"
aws-sdk-route53 = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-apigateway = "1"
aws-sdk-ec2 = "1"
aws-sdk-cloudformation = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-acm = "1"
aws-sdk-cognitoidentityprovider = "1"
aws-sdk-ecs = "1"
aws-sdk-rds = "1"
aws-sdk-firehose = "1"
aws-sdk-glue = "1"
aws-sdk-athena = "1"
aws-sdk-cloudtrail = "1"
aws-sdk-eks = "1"
aws-sdk-ses = "1"
aws-sdk-sesv2 = "1"
aws-sdk-batch = "1"
aws-sdk-backup = "1"
aws-sdk-scheduler = "1"
aws-sdk-organizations = "1"
aws-sdk-comprehend = "1"
aws-sdk-elasticache = "1"
aws-sdk-redshift = "1"
aws-sdk-glacier = "1"
aws-sdk-cloudfront = "1"
aws-sdk-kafka = "1"
aws-sdk-neptune = "1"
aws-sdk-docdb = "1"
aws-sdk-mq = "1"
aws-sdk-sagemaker = "1"
aws-sdk-rekognition = "1"
aws-sdk-memorydb = "1"
aws-sdk-globalaccelerator = "1"
aws-sdk-forecast = "1"
aws-sdk-route53resolver = "1"
aws-sdk-config = "1"
aws-sdk-elasticbeanstalk = "1"
aws-sdk-directory = "1"
aws-sdk-servicequotas = "1"
aws-sdk-amplify = "1"
aws-sdk-appmesh = "1"
aws-sdk-appsync = "1"
aws-sdk-cloudcontrol = "1"
aws-sdk-codeconnections = "1"
aws-sdk-dlm = "1"
aws-sdk-ebs = "1"
aws-sdk-gamelift = "1"
aws-sdk-location = "1"
aws-sdk-macie2 = "1"
aws-sdk-pipes = "1"
aws-sdk-pinpointsmsvoicev2 = "1"
aws-sdk-emrserverless = "1"
aws-sdk-entityresolution = "1"
aws-sdk-resiliencehub = "1"
aws-sdk-finspace = "1"
aws-sdk-securitylake = "1"
aws-sdk-s3control = "1"
aws-sdk-codeguruprofiler = "1"
aws-sdk-codegurureviewer = "1"
aws-sdk-dataexchange = "1"
aws-sdk-costexplorer = "1"
aws-credential-types = { version = "1", features = ["test-util"] }
rstest = "0.26"
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
