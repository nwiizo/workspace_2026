[package]
name = "cargo-rustguard"
version = "0.1.0"
edition = "2024"
authors = ["nwiizo"]
description = "MIR-level static analysis tool for Rust: unsafe impact mapping, ownership anomaly detection"
license = "MPL-2.0"
repository = "https://github.com/nwiizo/rustguard"
keywords = ["static-analysis", "unsafe", "ownership", "mir", "cargo-subcommand"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "cargo-rustguard"
path = "src/main.rs"

[lib]
name = "rustguard"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
colored = "3"

[dev-dependencies]
tempfile = "3.15"
