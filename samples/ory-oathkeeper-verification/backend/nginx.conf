events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location /health {
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
        }

        location /api/public {
            return 200 '{"message": "This is a public endpoint", "authenticated": false}';
            add_header Content-Type application/json;
        }

        location /api/protected {
            set $user_id $http_x_authenticated_user;
            return 200 '{"message": "This is a protected endpoint", "user": "$user_id"}';
            add_header Content-Type application/json;
        }

        location ~ ^/api/documents/([a-zA-Z0-9_-]+)$ {
            set $doc_id $1;
            set $user_id $http_x_user_id;
            set $method $request_method;

            if ($method = GET) {
                return 200 '{"document": "$doc_id", "user": "$user_id", "action": "view"}';
            }
            if ($method = PUT) {
                return 200 '{"document": "$doc_id", "user": "$user_id", "action": "edit"}';
            }
            if ($method = DELETE) {
                return 200 '{"document": "$doc_id", "user": "$user_id", "action": "delete"}';
            }

            add_header Content-Type application/json;
        }
    }
}
