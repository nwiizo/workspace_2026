<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ローカルの Markdown ファイルに保存する日記アプリ"
    />
    <title>日々 — Markdown 日記</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">日々</span>
          <div>
            <strong>Hibi</strong>
            <span>Markdown diary</span>
          </div>
        </div>

        <button class="today-button" id="today-button" type="button">
          <span aria-hidden="true">＋</span>
          今日の日記
        </button>

        <div class="entries-heading">
          <span>これまでの日記</span>
          <span id="entry-count">0</span>
        </div>
        <nav id="entry-list" class="entry-list" aria-label="日記一覧"></nav>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div class="entry-identity">
            <label for="entry-date">日付</label>
            <input id="entry-date" type="date" />
            <h1 id="entry-title">新しい日記</h1>
          </div>
          <button class="save-button" id="save-button" type="button" disabled>
            保存
            <kbd>⌘ S</kbd>
          </button>
        </header>

        <div class="writing-area">
          <section class="editor-panel" aria-labelledby="editor-label">
            <div class="panel-heading">
              <h2 id="editor-label">Markdown</h2>
              <span id="character-count">0 文字</span>
            </div>
            <textarea
              id="editor"
              spellcheck="true"
              aria-label="Markdown で日記を書く"
              placeholder="# 今日のこと&#10;&#10;ここに日記を書きます…"
            ></textarea>
          </section>

          <section class="preview-panel" aria-labelledby="preview-label">
            <div class="panel-heading">
              <h2 id="preview-label">プレビュー</h2>
              <span>読みやすい表示</span>
            </div>
            <article id="preview" class="preview prose">
              <p class="preview-placeholder">書き始めると、ここにプレビューが表示されます。</p>
            </article>
          </section>
        </div>

        <footer class="status-bar">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="status-message" role="status" aria-live="polite">準備中…</span>
          <span class="storage-note">ローカル Markdown に保存</span>
        </footer>
      </section>
    </main>
  </body>
</html>
