[package]
name = "ory-hydra-rust"
version = "0.1.0"
edition = "2024"
description = "Authentication provider for Ory Hydra written in Rust"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# JWT
jsonwebtoken = "9"

# Password Hashing
argon2 = "0.5"
password-hash = "0.5"

# Session Management
tower-sessions = "0.13"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
rust_decimal = { version = "1", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

# Configuration
dotenvy = "0.15"
base64 = "0.22"
urlencoding = "2.1"
