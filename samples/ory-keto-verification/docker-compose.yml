services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: keto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keto"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - keto

  keto-migrate:
    image: oryd/keto:v0.12.0
    environment:
      DSN: postgres://postgres:secret@postgres:5432/keto?sslmode=disable
    command: migrate up --yes --config /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keto

  keto:
    image: oryd/keto:v0.12.0
    environment:
      DSN: postgres://postgres:secret@postgres:5432/keto?sslmode=disable
      LOG_LEVEL: debug
    command: serve --config /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro
    ports:
      - "4466:4466"  # Read API
      - "4467:4467"  # Write API
      - "4468:4468"  # Metrics
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4466/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keto

volumes:
  postgres_data:

networks:
  keto:
