[package]
name = "ory-hydra-verification"
version = "0.1.0"
edition = "2021"
description = "Technical verification for Ory Hydra authentication patterns"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = "0.7"
rand_core = { version = "0.6", features = ["std"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
