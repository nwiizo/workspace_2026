[package]
name = "flux-discount-verification"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["service"]
resolver = "3"

[dependencies]
flux-rs = { git = "https://github.com/flux-rs/flux.git", rev = "ef6af17f647cf98c860e18e90c36d1f1b69849ff" }

[package.metadata.flux]
enabled = true
check-overflow = "strict"

[features]
failing = []

[[bin]]
name = "failing"
path = "src/bin/failing.rs"
required-features = ["failing"]
