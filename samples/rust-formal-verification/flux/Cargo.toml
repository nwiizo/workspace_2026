[package]
name = "flux-discount-verification"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["service"]
resolver = "3"

[dependencies]
flux-rs = { git = "https://github.com/flux-rs/flux.git", rev = "bd5de273235457a5922280cc180c4a6a2990418a" }

[package.metadata.flux]
enabled = true
check-overflow = "strict"

[features]
failing = []

[[bin]]
name = "failing"
path = "src/bin/failing.rs"
required-features = ["failing"]
