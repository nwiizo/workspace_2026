[package]
name = "verus-discount-verification"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["service"]
resolver = "3"

[dependencies]
vstd = "=0.0.0-2026-07-12-0122"

[features]
failing = []

[[bin]]
name = "failing"
path = "src/bin/failing.rs"
required-features = ["failing"]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)"] }
