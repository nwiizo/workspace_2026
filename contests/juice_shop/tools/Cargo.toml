[package]
name = "juice-shop-tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "z85-coupon"
path = "src/bin/z85_coupon.rs"

[[bin]]
name = "zip-slip"
path = "src/bin/zip_slip.rs"

[[bin]]
name = "ssrf-attack"
path = "src/bin/ssrf_attack.rs"

[dependencies]
z85 = "3.0"
zip = "0.6"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
thiserror = "1.0"
