# This configuration is mounted only when ISUCON_DIAGNOSTIC=1.
# Keep high-frequency timing logs out of the normal benchmark configuration.
map $upstream_response_time $isucon_upstream_response_time {
  default $upstream_response_time;
  "-" 0;
}

map $upstream_connect_time $isucon_upstream_connect_time {
  default $upstream_connect_time;
  "-" 0;
}

log_format isucon_timing escape=json
  '{"time":"$time_iso8601",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"request_bytes":$request_length,'
  '"body_bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"response_time":$isucon_upstream_response_time,'
  '"upstream_connect_time":$isucon_upstream_connect_time,'
  '"connection":$connection,'
  '"connection_requests":$connection_requests}';

server {
  listen 80 default_server;
  server_name _;

  access_log off;
  client_max_body_size 10m;
  root /home/isucon/webapp/public;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    access_log /dev/stdout isucon_timing;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://webapp:8080;
  }

  location /api/internal/ {
    allow 172.16.0.0/12;
    deny all;
    access_log /dev/stdout isucon_timing;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://webapp:8080;
  }
}
